<meta charset="utf-8">
<title>v3 依頼受付箱モック</title>
<!--
  v3 依頼受付箱の UI モック（静的・自己完結・DB/IAP 不要）。
  設計: docs/design/v3-backlog-request-scheme.md
    - 入口は Slack /法務依頼。Slack アプリが Backlog に起案し、同時に受付箱へ登録する。
    - Backlog への書込みは起案だけ。以後は読みに行く（pull）。GAS・Backlog 直接起票も pull で受付箱へ。
    - 依頼者への連絡は Slack アプリ（受付・保留・重複・対象外・工程の節目）。
    - 取り込んだ依頼は受付箱で人が受け付ける。
    - 受け付けた依頼は案件の工程バー先頭「受付」（lifecycle_stage=intake）に接続する。
  トークンは src/index.css の :root（paper terminal）/ .dark（CRT）に準拠。
  上部の画面切替で 受付箱 / 案件（工程バー）/ Slack 通知 / 取得ログ を確認できる。操作はページ内だけで反映される。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --background:40 40% 97%; --foreground:30 20% 12%; --card:40 30% 99%;
  --muted:36 20% 94%; --muted-foreground:30 10% 34%; --accent:36 25% 88%;
  --border:30 12% 80%; --grid:30 15% 88%; --ring:30 30% 30%;
  --primary:30 20% 12%; --primary-foreground:40 40% 97%;
  --phosphor:28 95% 45%; --cyan:195 70% 38%;
  --success:145 60% 30%; --warning:38 92% 38%; --info:200 72% 36%;
  --destructive:8 70% 45%; --on-solid:40 40% 97%;
  --radius:4px;
  --font-sans:'Geist','Noto Sans JP','Hiragino Sans',system-ui,sans-serif;
  --font-mono:'Geist Mono','JetBrains Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --background:220 18% 6%; --foreground:130 30% 88%; --card:220 16% 9%;
    --muted:220 14% 12%; --muted-foreground:130 12% 72%; --accent:220 14% 16%;
    --border:220 14% 20%; --grid:220 14% 14%; --ring:130 60% 55%;
    --primary:130 60% 55%; --primary-foreground:220 20% 6%;
    --phosphor:130 80% 55%; --cyan:195 80% 60%;
    --success:145 55% 58%; --warning:38 92% 60%; --info:195 78% 62%;
    --destructive:0 75% 55%; --on-solid:220 20% 6%;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --background:220 18% 6%; --foreground:130 30% 88%; --card:220 16% 9%;
  --muted:220 14% 12%; --muted-foreground:130 12% 72%; --accent:220 14% 16%;
  --border:220 14% 20%; --grid:220 14% 14%; --ring:130 60% 55%;
  --primary:130 60% 55%; --primary-foreground:220 20% 6%;
  --phosphor:130 80% 55%; --cyan:195 80% 60%;
  --success:145 55% 58%; --warning:38 92% 60%; --info:195 78% 62%;
  --destructive:0 75% 55%; --on-solid:220 20% 6%;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:hsl(var(--background));color:hsl(var(--foreground));font-family:var(--font-sans);font-size:14px;line-height:1.55}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid hsl(var(--ring));outline-offset:2px}
a{color:hsl(var(--cyan))}
[hidden]{display:none!important}

/* モック用 画面切替 */
.mockbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 16px;background:hsl(var(--primary));color:hsl(var(--primary-foreground))}
.mockbar .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-right:6px}
.mockbar button{border:1px solid hsl(var(--primary-foreground)/.25);background:transparent;padding:4px 10px;border-radius:var(--radius);cursor:pointer;font-size:12.5px}
.mockbar button[aria-pressed="true"]{background:hsl(var(--primary-foreground));color:hsl(var(--primary))}
.mockbar .note{margin-left:auto;font-size:11px;opacity:.7}

/* 骨格 */
.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 44px)}
.side{border-right:1px solid hsl(var(--border));padding:16px 12px;display:flex;flex-direction:column;gap:2px;background:hsl(var(--card))}
.side .brand{font-family:var(--font-mono);font-weight:600;font-size:13px;letter-spacing:.06em;margin-bottom:14px}
.side .brand b{color:hsl(var(--phosphor))}
.side .grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:hsl(var(--muted-foreground));margin:12px 8px 4px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:var(--radius);text-decoration:none;color:inherit;font-size:13px;cursor:pointer}
.side a.on{background:hsl(var(--accent));font-weight:600}
.side .badge{font-family:var(--font-mono);font-size:11px;min-width:20px;text-align:center;padding:0 5px;border-radius:999px;background:hsl(var(--phosphor));color:hsl(var(--on-solid))}
main{padding-block:20px 48px;padding-inline:24px;min-width:0}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid hsl(var(--border));padding:10px 16px}
  .side .brand,.side .grp{display:none}
  main{padding-inline:16px}
}
h1{font-size:20px;margin:0;text-wrap:balance;font-weight:650}
h2{font-size:12px;margin:0 0 10px;font-family:var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--muted-foreground));font-weight:500}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:14px}
.sub{color:hsl(var(--muted-foreground));font-size:12.5px;margin-top:4px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid hsl(var(--border));background:hsl(var(--card));padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:13px;white-space:nowrap}
.btn:hover{background:hsl(var(--accent))}
.btn.pri{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:hsl(var(--primary))}
.btn.pri:hover{opacity:.9}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.panel{border:1px solid hsl(var(--border));background:hsl(var(--card));border-radius:var(--radius);padding:14px 16px}
.k2{font-family:var(--font-mono);font-size:11px;color:hsl(var(--muted-foreground))}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--c,hsl(var(--border)));color:var(--c,hsl(var(--muted-foreground)));white-space:nowrap;line-height:18px}
.chip.solid{background:var(--c);color:hsl(var(--on-solid))}
.guess{font-size:10.5px;font-family:var(--font-mono);color:hsl(var(--info));border:1px dashed hsl(var(--info)/.6);border-radius:3px;padding:0 4px}

/* 受付箱ヘッダ */
.pullbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:8px 12px;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--muted));font-size:12.5px;margin-bottom:12px}
.pullbar .dot{width:8px;height:8px;border-radius:50%;background:hsl(var(--success));display:inline-block;margin-right:6px}
.pullbar .dot.busy{background:hsl(var(--warning))}
.tabs{display:flex;gap:2px;border-bottom:1px solid hsl(var(--border));margin-bottom:12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 12px;font-size:13px;color:hsl(var(--muted-foreground));cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:hsl(var(--foreground));border-bottom-color:hsl(var(--phosphor));font-weight:600}
.tabs .n{font-family:var(--font-mono);font-size:11px;margin-left:4px}

/* 受付箱 2ペイン */
.inbox{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start}
@media (max-width:1100px){.inbox{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--card));overflow:hidden}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 12px;border-bottom:1px solid hsl(var(--grid));cursor:pointer;text-align:left;border-left:3px solid transparent;background:none;border-top:0;border-right:0;width:100%}
.item:last-child{border-bottom:0}
.item:hover{background:hsl(var(--accent)/.5)}
.item[aria-current="true"]{background:hsl(var(--accent));border-left-color:hsl(var(--phosphor))}
.item .t{font-weight:500;font-size:13px;overflow-wrap:anywhere}
.item .m{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.empty{padding:28px 16px;text-align:center;color:hsl(var(--muted-foreground));font-size:13px}

/* 受付パネル */
.acc{display:flex;flex-direction:column;gap:12px;position:sticky;top:60px}
@media (max-width:1100px){.acc{position:static}}
.src{border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--card))}
.src-h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:10px 14px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--muted))}
.src-h .ro{margin-left:auto;font-size:11px;color:hsl(var(--muted-foreground))}
.src-b{padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.src-title{font-weight:650;font-size:15px;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:5px 14px;font-size:12.5px;margin:0}
.kv dt{color:hsl(var(--muted-foreground));font-size:12px}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.body{font-size:12.5px;white-space:pre-wrap;background:hsl(var(--muted));border-radius:var(--radius);padding:10px 12px;margin:0;max-height:180px;overflow:auto}
.cmt{font-size:12.5px;border-left:2px solid hsl(var(--info));padding:4px 10px}
.cmt.new{border-left-color:hsl(var(--phosphor));background:hsl(var(--phosphor)/.07)}
.warnbox{border:1px solid hsl(var(--warning)/.55);background:hsl(var(--warning)/.08);border-radius:var(--radius);padding:10px 12px;font-size:12.5px}
.warnbox b{color:hsl(var(--warning))}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:4px}
.field label{color:hsl(var(--muted-foreground));font-size:12px;display:flex;gap:6px;align-items:center}
.field input,.field select,.field textarea{border:1px solid hsl(var(--border));background:hsl(var(--background));border-radius:var(--radius);padding:6px 9px;font-size:13px;width:100%}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:1px solid hsl(var(--border));border-radius:var(--radius);cursor:pointer;font-size:12.5px}
.radio label:has(input:checked){border-color:hsl(var(--phosphor));background:hsl(var(--phosphor)/.07)}
.radio small{display:block;color:hsl(var(--muted-foreground))}
.radio input[type=radio]{width:auto;flex:none;margin:3px 0 0}
.radio label{color:hsl(var(--foreground))}
.radio .why{font-size:11px;color:hsl(var(--info))}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid hsl(var(--border));padding-top:12px}
.actions .grow{flex:1}

/* 工程バー */
.mhead{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:baseline;margin-bottom:16px}
.stagebar{display:flex;overflow-x:auto;padding:6px 2px 10px;gap:0}
.stg{flex:1 0 92px;position:relative;padding-top:30px;text-align:center;font-size:12px;color:hsl(var(--muted-foreground));background:none;border:0;cursor:default}
.stg::before{content:"";position:absolute;top:13px;left:0;right:0;height:2px;background:hsl(var(--border))}
.stg:first-child::before{left:50%}.stg:last-child::before{right:50%}
.stg .nd{position:absolute;top:6px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:hsl(var(--card));border:2px solid hsl(var(--border))}
.stg.past{color:hsl(var(--foreground))}
.stg.past::before,.stg.cur::before{background:hsl(var(--phosphor))}
.stg.past .nd{background:hsl(var(--phosphor));border-color:hsl(var(--phosphor))}
.stg.cur{color:hsl(var(--foreground));font-weight:650}
.stg.cur .nd{border-color:hsl(var(--phosphor));box-shadow:0 0 0 5px hsl(var(--phosphor)/.2)}
.stg.intake{cursor:pointer}
.stg.intake .nd{width:28px;height:28px;margin-left:-14px;top:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:12px;font-weight:600;color:hsl(var(--on-solid));background:hsl(var(--info));border-color:hsl(var(--info))}
.stg.intake.alert .nd{background:hsl(var(--phosphor));border-color:hsl(var(--phosphor))}
.stg.intake[aria-expanded="true"] .nd{box-shadow:0 0 0 4px hsl(var(--info)/.25)}
.stg.intake span.lbl{font-weight:650;color:hsl(var(--foreground))}
.connect{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:1000px){.connect{grid-template-columns:1fr}}
.req{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px dashed hsl(var(--grid));align-items:start}
.req:last-child{border-bottom:0}
.req .rel{font-family:var(--font-mono);font-size:10.5px;padding:1px 6px;border-radius:3px;border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));margin-top:2px}
.req .rel.primary{border-color:hsl(var(--phosphor));color:hsl(var(--phosphor))}
.req .t{font-size:13px;overflow-wrap:anywhere}
.req.fresh{background:hsl(var(--info)/.07)}
.slackprev{border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--muted));padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.slackprev .to{display:flex;flex-wrap:wrap;gap:6px}
.msg{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;font-size:13px}
.msg .av{width:32px;height:32px;border-radius:6px;background:hsl(var(--phosphor));color:hsl(var(--on-solid));display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:12px}
.msg .who{font-weight:650;font-size:13px}
.msg .who small{font-weight:400;color:hsl(var(--muted-foreground));font-family:var(--font-mono);font-size:11px;margin-left:6px}
.msg .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.dm{display:flex;flex-direction:column;gap:14px;max-height:560px;overflow:auto;padding:4px 2px}
.dm .ctx{font-size:11px;color:hsl(var(--muted-foreground));font-family:var(--font-mono)}
.slackgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;align-items:start}
@media (max-width:1000px){.slackgrid{grid-template-columns:1fr}}
.rules td{white-space:normal}
.rules input{width:auto}
.next{border-left:3px solid hsl(var(--phosphor));padding:8px 12px;background:hsl(var(--phosphor)/.06);border-radius:0 var(--radius) var(--radius) 0;font-size:13px}

/* テーブル */
.tbl-wrap{overflow-x:auto;border:1px solid hsl(var(--border));border-radius:var(--radius);background:hsl(var(--card))}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:13px}
th{text-align:left;font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:hsl(var(--muted-foreground));padding:8px 10px;border-bottom:1px solid hsl(var(--border));background:hsl(var(--muted));white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid hsl(var(--grid));white-space:nowrap}
td.num{text-align:right;font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* ダイアログ・トースト */
.scrim{position:fixed;inset:0;background:hsl(var(--foreground)/.35);display:flex;align-items:center;justify-content:center;padding:16px;z-index:80}
.dlg{background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:6px;max-width:540px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.dlg h1{font-size:17px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:hsl(var(--foreground));color:hsl(var(--background));padding:8px 14px;border-radius:var(--radius);font-size:13px;z-index:90;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast button{border:0;background:none;color:hsl(var(--phosphor));text-decoration:underline;cursor:pointer;padding:0}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}
</style>

function recipients(ev, r, mc){
  const rule = RULE(ev); if (!rule || !rule.on) return [];
  const to = [];
  if (rule.dm && r && r.by && !/手動/.test(r.by)) to.push("@" + r.by);
  if (rule.dept && r && DEPT_CH[r.dept]) to.push(DEPT_CH[r.dept]);
  if (rule.thread && mc) to.push("🧵 " + mc);
  return to;
}
function msgText(ev, r, mc, extra = {}){
  const m = mc ? MATTERS[mc] : null;
  const k = r ? r.key : "";
  switch (ev){
    case "accepted_new": return `✅ 受け付けました（${k}）\n案件：${mc} ${m.title}\n担当：${m.owner}　希望納期：${r.due ? r.due.slice(5).replace("-","/") : "—"}\n次の工程：${STAGE_LABEL[m.stage]}`;
    case "accepted_existing": return `✅ 受け付けました（${k}）\n${mc} ${m.title} の案件で対応します。\n担当：${m.owner}　次アクション：${m.next}`;
    case "held": return `⏸ 確認させてください（${k}）\n${extra.reason}\nこのメッセージに返信してください。${extra.until ? extra.until.slice(5).replace("-","/") : ""} に再確認します。`;
    case "duplicate": return `🔁 ${k} は ${extra.ofKey} と同じ依頼として扱います。\n案件：${mc}　担当：${m.owner}`;
    case "dismissed": return `この依頼（${k}）は法務の対応対象外としました。理由：${extra.reason}\nご不明点は法務までご連絡ください。`;
    default:
      if (ev === "stage:performance") return `📦 ${mc} ${m.title} は「履行」に入りました。\n納品を受けたら /法務依頼 →「納品・検収」→ 対象課題に ${extra.primaryKey || "この案件の課題"} を選んで報告してください。`;
      if (ev === "stage:completion_check") return `🏁 ${mc} ${m.title} は完了確認に入りました。追加の依頼がなければ完了します。`;
      return `➡ ${mc} ${m.title}：「${STAGE_LABEL[ev.slice(6)]}」に進みました。担当：${m.owner}`;
  }
}

  const cand = R.filter(r => r.state === "new" || r.state === "on_hold");
  dialog(`<h1>受付箱から接続</h1><div class="sub">${matterSel} の「受付」に接続する依頼を選びます。</div>
    <div class="radio">${cand.map((r,i) => `<label><input type="radio" name="lk" value="${r.no}"${i === 0 ? " checked" : ""}><span><b class="mono" style="font-weight:500">${r.key}</b> ${esc(r.title)}<small>推定 ${esc(tl(r.guess))}</small></span></label>`).join("") || `<div class="sub">未処理の依頼はありません。</div>`}</div>
    <div class="row" style="justify-content:flex-end"><button class="btn" data-x>やめる</button><button class="btn pri" id="lkOk" ${cand.length ? "" : "disabled"}>接続する</button></div>`, h => {
      h.querySelector("#lkOk").addEventListener("click", () => {
        const r = byNo(h.querySelector("input[name=lk]:checked").value);
        r.type = r.guess || "admin_procedure"; r.state = "accepted"; r.matter = matterSel; r.rel = TYPES[r.type][1] === "支払準備" ? "partial" : "related"; r.acceptedAt = TODAY.slice(5).replace("-","/");
        freshNo = r.no; closeDlg(); toast(`${r.key} を ${matterSel} の「受付」に接続しました`); renderMatter(); updateNav();
      });
    });
}

/* ── Slack 通知 ── */
let dmWho = "山本 さくら";
function renderSlack(){
  const people = [...new Set(NOTIFS.flatMap(n => n.to.filter(t => t.startsWith("@")).map(t => t.slice(1))))];
  if (!people.includes(dmWho)) dmWho = people[0];
  const dms = NOTIFS.filter(n => n.to.includes("@" + dmWho));
  $("#v-slack").innerHTML = `
    <div class="head"><div><h1>Slack 通知</h1><div class="sub">依頼者への連絡は Slack アプリから送ります。起点は受付箱の操作と案件工程の節目だけで、Backlog のステータス変化では通知しません。</div></div></div>
    <div class="slackgrid">
      <div class="panel">
        <h2>通知ルール（notify_rules）</h2>
        <div class="tbl-wrap" style="border:0"><table class="rules" style="min-width:0">
          <thead><tr><th>出来事</th><th>DM</th><th>部署ch</th><th>案件スレッド</th><th>ON</th></tr></thead>
          <tbody>${RULES.map((x,i) => `<tr><td>${x.label}</td>${["dm","dept","thread","on"].map(f => `<td><input type="checkbox" data-r="${i}" data-f="${f}" aria-label="${x.label} ${f}"${x[f] ? " checked" : ""}></td>`).join("")}</tr>`).join("")}</tbody>
        </table></div>
        <div class="sub">細かい工程（起案・社内レビュー）は既定で通知しません。全停止スイッチ SLACK_NOTIFY_DISABLED は緊急用に残します。</div>
      </div>
      <div class="panel">
        <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">依頼者の DM（Slack アプリ）</h2>
          <select id="dmSel" class="btn" aria-label="依頼者">${people.map(p => `<option${p === dmWho ? " selected" : ""}>${esc(p)}</option>`).join("")}</select></div>
        <div class="dm">${dms.map(n => `<div class="msg"><span class="av">LB</span><div><div class="who">LegalBridge<small>APP ・ ${n.when}</small></div><div class="txt">${esc(n.text)}</div>
          ${n.to.length > 1 ? `<div class="ctx">同時に：${n.to.filter(t => t !== "@" + dmWho).map(esc).join("、")}</div>` : ""}</div></div>`).join("") || `<div class="sub">まだ通知はありません。</div>`}</div>
      </div>
    </div>`;
  $("#dmSel").addEventListener("change", e => { dmWho = e.target.value; renderSlack(); });
  $("#v-slack").querySelectorAll("input[data-r]").forEach(c => c.addEventListener("change", () => { RULES[+c.dataset.r][c.dataset.f] = c.checked; toast(`通知ルールを更新しました（${RULES[+c.dataset.r].label}）`); }));
}

/* ── 取得ログ ── */
function renderRuns(){
  $("#v-runs").innerHTML = `
    <div class="head"><div><h1>取得ログ</h1><div class="sub">Backlog から依頼を取りに行った記録です（backlog_pull_runs）。失敗した回は updatedSince を進めず、次の回で取り直します。</div></div>
      <button class="btn" data-go="inbox">受付箱へ</button></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>実行</th><th>トリガ</th><th>updatedSince</th><th>取得</th><th>受付箱へ新規</th><th>原票更新</th><th>結果</th></tr></thead>
      <tbody>${RUNS.map(x => `<tr><td class="mono">${x.at.slice(5)}</td><td>${TRIG[x.trig]}</td><td class="mono">${x.since}</td><td class="num">${x.fetched}</td><td class="num">${x.created}</td><td class="num">${x.updated}</td>
        <td>${x.err ? `<span class="chip" style="--c:hsl(var(--destructive))">失敗</span> <span style="font-size:12px">${esc(x.err)}</span>` : `<span class="chip" style="--c:hsl(var(--success))">成功</span>`}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

/* ── 共通 ── */
// 例示データに合わせた仮の時計（09/25 10:45 から操作ごとに1分進む）
let clock = 10*60 + 45;
function nowHM(){ const t = clock++; return `${String(Math.floor(t/60)).padStart(2,"0")}:${String(t%60).padStart(2,"0")}`; }
function dialog(html, onMount){
  $("#dlgHost").innerHTML = `<div class="scrim" role="dialog" aria-modal="true"><div class="dlg">${html}</div></div>`;
  const host = $("#dlgHost .scrim");
  host.addEventListener("click", e => { if (e.target === host || e.target.closest("[data-x]")) closeDlg(); });
  onMount(host);
  const f = host.querySelector("input,select,textarea,button.pri"); if (f) f.focus();
}
function closeDlg(){ $("#dlgHost").innerHTML = ""; }
let tt;
function toast(msg, action){
  clearTimeout(tt);
  $("#toastHost").innerHTML = `<div class="toast" role="status"><span>${esc(msg)}</span>${action ? `<button id="tAct">案件を開く</button>` : ""}</div>`;
  if (action) $("#tAct").addEventListener("click", () => { $("#toastHost").innerHTML = ""; action(); });
  tt = setTimeout(() => $("#toastHost").innerHTML = "", action ? 6000 : 2800);
}
function updateNav(){ $("#navInbox").textContent = inboxOf("new").length + inboxOf("updated").length; }
function render(){
  if (view === "inbox") renderInbox();
  if (view === "matter") renderMatter();
  if (view === "runs") renderRuns();
  if (view === "slack") renderSlack();
  updateNav();
}
const start = (location.hash || "").slice(1);
go(["inbox","matter","slack","runs"].includes(start) ? start : "inbox");
})();
</script>
